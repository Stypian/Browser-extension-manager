<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css" type="text/css"/>
  <script src="index.js" type="module" defer></script>
  <title>Frontend Mentor | Browser extensions manager UI</title>
</head>
<body>
  <main class="brows-ext__main" role="main">
    <div class="brows-ext__main-inner">
      <header class="brows-ext__header">
        <div class="brows-ext__header-top">
           <img class="brows-ext__logo-img" src="assets/images/logodark.svg" alt="browser extensions manager"/>
           <div class="brows-ext__sun-logo-box" tabindex="1" role="button" aria-label="Toggle light and dark theme">
            <img class="brows-ext__sun-logo" src="assets/images/icon-sun.svg" alt="change color theme"/>
           </div>
        </div>
        <div class="brows-ext__header-bottom">
          <h1 class="brows-ext__h1">Extensions List</h1>
          <div class="brows-ext__active-wrap">
            <div class="brows-ext__active-button brows-ext__active-button--selected brows-ext__active-button-light--selected" tabindex="2" role="button" aria-label="Show all extensions">
              <span class="brows-ext__active-h2 brows-ext__active-h2--selected brows-ext__active-h2-light--selected">All</span>
            </div>
            <div class="brows-ext__active-button" tabindex="3" role="button" aria-label="Show active extensions">
              <span class="brows-ext__active-h2">Active</span>
            </div>
            <div class="brows-ext__active-button" tabindex="4" role="button" aria-label="Show inactive extensions">
              <span class="brows-ext__active-h2">Inactive</span>
            </div>
          </div>
        </div>
      </header>
      <section class="brows-ext__body brows-ext__all" aria-label="extensions manager content" aria-live="polite"></section>
    </div>
  </main>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">RonL</a>.
  </div>
</body>
</html>
